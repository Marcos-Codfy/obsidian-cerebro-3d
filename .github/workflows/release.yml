name: Release

# Ao criar uma tag com a versão (ex.: 3.4.0), compila o plugin e publica a release
# com os três arquivos que o Obsidian precisa (main.js, manifest.json, styles.css).
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" main.js manifest.json styles.css --clobber \
            || gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "Cérebro 3D $GITHUB_REF_NAME" --notes "Veja o CHANGELOG.md"
